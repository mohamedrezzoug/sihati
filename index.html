<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C5965">
<title>قصتي الصحية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a patient's carnet de santé — identity card on top, the health story as a dated spine, sections in a tab bar (bottom on phones). */
:root{
  --paper:#F2F6F5; --card:#FFFFFF; --ink:#13303A; --muted:#5A6F77; --line:#D3DFDD;
  --primary:#1C5965; --primary-soft:#E0EEEE; --on-primary:#FFFFFF;
  --saffron:#B97F0F; --saffron-soft:#F7EDD6;
  --good:#2D7A4D; --good-soft:#E1F1E7; --warn:#A8701A; --warn-soft:#F8EBD3; --bad:#A9433A; --bad-soft:#F6E2DF;
  --shadow:0 1px 2px rgba(19,48,58,.06),0 4px 14px rgba(19,48,58,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E191C; --card:#15242A; --ink:#E2ECEB; --muted:#93A8AD; --line:#26393F;
  --primary:#6DB5C0; --primary-soft:#1A3238; --on-primary:#0B1B1F;
  --saffron:#E3AE47; --saffron-soft:#352B16;
  --good:#5DBA84; --good-soft:#173226; --warn:#E0A64A; --warn-soft:#352A15; --bad:#E57D72; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E191C; --card:#15242A; --ink:#E2ECEB; --muted:#93A8AD; --line:#26393F;
  --primary:#6DB5C0; --primary-soft:#1A3238; --on-primary:#0B1B1F;
  --saffron:#E3AE47; --saffron-soft:#352B16;
  --good:#5DBA84; --good-soft:#173226; --warn:#E0A64A; --warn-soft:#352A15; --bad:#E57D72; --bad-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.app{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.2rem} h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
small{font-size:.82rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand h1{font-size:1.25rem}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}

.top{flex-wrap:wrap}
.top-acts{display:flex;gap:6px;flex-wrap:wrap}
.btn.sos{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);font-weight:600}
.who-btn{border:0;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:0 10px;font-weight:600;font-size:.82rem}
.people{display:flex;flex-direction:column;gap:8px;flex:1 1 100%}
.person{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.person.cur{border-color:var(--primary);background:var(--primary-soft)}
.person-main{flex:1;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:start;min-width:0;padding:0}
.person-main small{display:block;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.sos-card{flex:1 1 100%;display:flex;flex-direction:column;gap:14px}
.sos-top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--bad-soft);border-radius:12px;padding:14px 16px}
.sos-top h3{font-size:1.3rem}
.sos-blood{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--bad);line-height:1;text-align:center}
.sos-blood small{display:block;font-size:.72rem;font-family:var(--f-body);font-weight:500;color:var(--muted);margin-top:4px}
.sos-sec h4{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.sos-al{display:flex;flex-wrap:wrap;gap:6px}
.sos-al span{background:var(--bad);color:var(--card);border-radius:8px;padding:3px 12px;font-weight:600;font-size:1.05rem}
.contact{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.contact .num{font-family:var(--f-display);font-size:1.1rem;font-weight:600;user-select:all}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr img{background:#fff;padding:6px;border-radius:10px;width:168px;height:168px;image-rendering:pixelated;flex:none}
.qa{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qa li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.qa li:last-child{border-bottom:0}
.qa .qt{min-width:0;overflow-wrap:anywhere}
.qa .qb{display:flex;gap:4px;flex:none}

/* nav */
.nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-block:6px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;padding:9px 6px;border-radius:10px;color:var(--muted);font-weight:500;font-size:.9rem}
.nav button svg{width:19px;height:19px;flex:none}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
@media (max-width:760px){
  .nav{position:fixed;inset:auto 0 0 0;margin:0;border-radius:0;border-width:1px 0 0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));top:auto}
  .nav button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px}
}

/* generic */
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ghost{border-color:transparent;background:none;color:var(--primary);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.84rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:500;background:var(--primary-soft);color:var(--primary)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.sf{background:var(--saffron-soft);color:var(--saffron)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;font-size:.9rem;background:var(--primary-soft);color:var(--ink)}
.note svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--primary)}
.note.sample{background:var(--saffron-soft)} .note.sample svg{color:var(--saffron)}
.note.alert{background:var(--warn-soft)} .note.alert svg{color:var(--warn)}
.note b{font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;min-width:0}
textarea{resize:vertical}

/* identity card */
.idcard{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:18px 20px}
.idcard h2{font-size:1.35rem}
.idcard .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;opacity:.92;margin-top:4px}
.blood{font-family:var(--f-display);font-size:1.5rem;font-weight:700;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 14px;text-align:center;line-height:1.2}
.blood small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:500;opacity:.85}
.allergy{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.allergy .a{background:var(--card);color:var(--bad);border-radius:6px;padding:1px 9px;font-weight:600}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.glance .card{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.glance .k{font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.glance .v{font-family:var(--f-display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
@media (max-width:560px){.glance{grid-template-columns:1fr}}

/* timeline */
.tl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-tools input{flex:1 1 200px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:76px;width:2px;background:var(--line)}
.tl-month{font-family:var(--f-display);font-weight:600;font-size:.86rem;color:var(--muted);padding:14px 0 6px;position:relative;letter-spacing:.02em}
.tl-month span{background:var(--paper);padding-inline-end:8px;position:relative}
.ev{display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:0 4px;padding-block:6px;position:relative}
.ev-date{text-align:end;font-size:.82rem;color:var(--muted);padding-top:12px;line-height:1.3}
.ev-date b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);font-weight:600}
.ev-dot{width:14px;height:14px;border-radius:50%;margin:16px auto 0;border:3px solid var(--paper);box-sizing:content-box;background:var(--c,var(--primary));position:relative;z-index:1}
.ev-body{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.ev-body .t{font-weight:600;color:var(--c,var(--primary));font-size:.85rem}
.ev-body .d{margin-top:1px;overflow-wrap:anywhere}
.ev-body .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.ev.future .ev-body{border-style:dashed}
.ev.future .ev-dot{background:var(--paper);border-color:var(--c)}
.g-dis{--c:var(--bad)} .g-med{--c:var(--primary)} .g-doc{--c:var(--saffron)} .g-visit{--c:var(--good)} .g-note{--c:var(--muted)}

/* meds */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.slot .time{font-family:var(--f-display);font-weight:600;font-size:1.1rem;background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:4px 10px}
.slot.taken{opacity:.75} .slot.taken .time{background:var(--good-soft);color:var(--good)}
.slot.late{border-color:var(--warn)} .slot.late .time{background:var(--warn-soft);color:var(--warn)}
.slot .who{min-width:0} .slot .who b{display:block} .slot .who small{color:var(--muted)}
.slot .sb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.med{display:flex;flex-direction:column;gap:10px}
.med-h{display:flex;gap:12px;align-items:flex-start}
.med-ph{width:62px;height:62px;border-radius:10px;background:var(--primary-soft);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--primary)}
.med-ph img{width:100%;height:100%;object-fit:cover}
.med-h h3{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.med-f{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.side{font-size:.86rem;background:var(--paper);border-radius:8px;padding:6px 10px}

/* measures */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;min-width:420px;height:auto;display:block}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.92rem}
.row:last-child{border-bottom:0}
.row .val{font-family:var(--f-display);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}

/* docs */
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.doc:hover{border-color:var(--primary)}
.doc-ic{width:52px;height:52px;border-radius:9px;background:var(--saffron-soft);color:var(--saffron);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:.75rem}
.doc-ic img{width:100%;height:100%;object-fit:cover}
.doc b{display:block;overflow-wrap:anywhere}

/* profile */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li span{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle input{width:20px;height:20px;accent-color:var(--primary)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,24,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.sheet{align-items:center;padding:24px}}
.sheet-card{background:var(--card);width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-card{border-radius:18px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-b{padding:16px 18px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:12px}
.sheet-f{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;flex:1 1 100%;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld>span{font-size:.86rem;font-weight:500}
.fld small{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;flex:1 1 100%}
.err{color:var(--bad);font-size:.86rem;flex:1 1 100%}
.report{flex:1 1 100%;display:flex;flex-direction:column;gap:14px}
.report h4{margin:0 0 4px;font-family:var(--f-display);font-size:.95rem;color:var(--primary)}
.report ul{margin:0;padding-inline-start:18px}
.report li{margin-block:2px}
.doc-view{flex:1 1 100%}
.doc-view img{border-radius:10px;border:1px solid var(--line)}
.doc-view iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:7px;padding:2px 10px}
@media (prefers-reduced-motion:no-preference){.sheet-card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
      <div><h1>قصتي الصحية</h1><p><button class="who-btn" data-act="people" id="whoBtn"></button> <span id="todayLbl"></span></p></div>
    </div>
    <div class="top-acts"><button class="btn sm sos" data-act="sos">بطاقة الطوارئ</button><button class="btn sm" data-act="report">ملخص للطبيب</button></div>
  </header>
  <nav class="nav" id="nav" aria-label="الأقسام"></nav>
  <main id="view"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="x" data-act="close" aria-label="إغلاق"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-b" id="sheetBody"></div>
    <div class="sheet-f" id="sheetFoot"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
const fmt=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${+d} ${MONTHS[m-1]} ${y}`};
const fmtShort=s=>{const[,m,d]=s.split('-');return `${+d} ${MONTHS[m-1]}`};

/* ---------- domain ---------- */
const active=(m,d)=>m.start<=d&&(!m.end||m.end>=d);
function setDose(m,t,st){const k=today()+'|'+t,prev=m.log[k];if(st)m.log[k]=st;else delete m.log[k];
 if(m.stock!=null){if(prev==='taken'&&st!=='taken')m.stock+=m.perDose;if(prev!=='taken'&&st==='taken')m.stock=Math.max(0,m.stock-m.perDose)}}
function daysLeft(m){if(m.stock==null||!m.times.length)return null;return Math.floor(m.stock/((m.perDose||1)*m.times.length))}
const lowMeds=(P=S)=>P.meds.filter(m=>active(m,today())&&daysLeft(m)!=null&&daysLeft(m)<=m.lowDays);
const daysTxt=n=>n===0?'سالا':n===1?'نهار واحد':n===2?'جوج أيام':`${n} أيام`;
function todaySlots(P=S){const d=today(),n=hmMin(nowHM()),out=[];P.meds.filter(m=>active(m,d)).forEach(m=>m.times.forEach(t=>{const st=m.log[d+'|'+t];out.push({m,t,st,late:!st&&n-hmMin(t)>60})}));return out.sort((a,b)=>a.t.localeCompare(b.t))}
function adherence(m,from,to){let d=from<m.start?m.start:from;const end=m.end&&m.end<to?m.end:to;let exp=0,tk=0;const T=today(),n=hmMin(nowHM());let guard=0;
 while(d<=end&&guard++<800){m.times.forEach(t=>{if(d===T&&hmMin(t)>n)return;exp++;if(m.log[d+'|'+t]==='taken')tk++});d=addDays(d,1)}return {exp,tk,pct:exp?Math.round(tk/exp*100):null}}
function inRange(type,m){const r=S.ranges[type];if(!r)return null;
 if(type==='bp'){const a=(r.min==null||m.v.sys>=r.min)&&(r.max==null||m.v.sys<=r.max),b=(r.min2==null||m.v.dia>=r.min2)&&(r.max2==null||m.v.dia<=r.max2);return a&&b}
 return (r.min==null||m.v>=r.min)&&(r.max==null||m.v<=r.max)}
function valText(m){if(m.type==='bp')return `${m.v.sys}/${m.v.dia}${m.v.pulse?' · نبض '+m.v.pulse:''}`;return `${m.v} ${MT[m.type].unit}`}
const visits=()=>S.docs.filter(d=>d.type==='visit').sort((a,b)=>a.date.localeCompare(b.date));
function lastVisitBefore(date){const v=visits().filter(x=>x.date<date);return v.length?v[v.length-1].date:addDays(date,-90)}

function events(){
 const E=[],p=S.profile,T=today();
 p.chronic.forEach(c=>c.date&&E.push({date:c.date,g:'dis',t:'إضافة مرض مزمن',d:c.name}));
 p.surgeries.forEach(s=>s.date&&E.push({date:s.date,g:'dis',t:s.kind==='استشفاء'?'استشفاء':'عملية جراحية',d:s.name}));
 S.meds.forEach(m=>{E.push({date:m.start,g:'med',t:'بداية دواء',d:`${m.name} — ${m.dose}، ${m.times.join(' و ')}`});
  if(m.end&&m.end<=T)E.push({date:m.end,g:'med',t:'نهاية دواء',d:m.name});
  (m.side||[]).forEach(s=>E.push({date:s.date,g:'med',t:'عرض جانبي ملاحظ',d:`${m.name}: ${s.text}`}))});
 S.docs.forEach(d=>E.push({date:d.date,g:['visit','appointment'].includes(d.type)?'visit':'doc',t:DT[d.type],d:d.title+(d.note?' — '+d.note:''),doc:d,future:d.date>T}));
 S.notes.forEach(n=>E.push({date:n.date,g:'note',t:'ملاحظة',d:n.text,note:n}));
 S.questions.filter(q=>q.done&&q.answeredOn).forEach(q=>E.push({date:q.answeredOn,g:'visit',t:'جواب الطبيب',d:`${q.text} — ${q.answer||'تجاوب'}`}));
 return E;
}

function vTrack(){

   :[{name:MT[t].label,c:'var(--primary)',pts:pts.map(m=>({d:m.date,v:+m.v}))}];

   <div class="chips">${[[30,'30 يوم'],[60,'60 يوم'],[180,'6 شهور']].map(([d,l])=>`<button class="chip" data-act="days" data-d="${d}" aria-pressed="${ui.days===d}">${l}</button>`).join('')}</div></div>

 <div class="card"><h3 style="margin-bottom:6px">السجل</h3>${list.length?`<div class="rows">${list.map(m=>{const ok=t==='daily'?null:inRange(t,m);

   :`<span><span class="val num">${esc(valText(m))}</span>${m.ctx?` <small class="muted">${esc(m.ctx)}</small>`:''}${m.place?` <small class="muted">${esc(m.place)}</small>`:''}${ok===false?' <span class="tag warn">خارج الحدود ديالك</span>':''}${m.note?`<br><small class="muted">${esc(m.note)}</small>`:''}</span>`;
  return `<div class="row"><small class="muted">${fmt(m.date)}${m.time?` <span class="num">${m.time}</span>`:''}</small>${body}<button class="x" data-act="m-del" data-id="${m.id}" aria-label="مسح">${'×'}</button></div>`}).join('')}</div>`:`<div class="empty">ما كاين حتى قياس فهاد المدة.</div>`}</div></div>`;

function rangeTxt(t,r){const f=(a,b)=>`${a??'…'}–${b??'…'}`;return t==='bp'?`${f(r.min,r.max)} / ${f(r.min2,r.max2)}`:f(r.min,r.max)}
function chartSVG(series,bands,unit){
 const all=series.flatMap(s=>s.pts);if(all.length<1)return '<div class="empty">ما كاينين قياسات كافية باش يبان الرسم.</div>';
 const W=640,H=230,L=46,R=16,T=14,B=30,tm=s=>new Date(s+'T12:00').getTime();
 let t0=Math.min(...all.map(p=>tm(p.d))),t1=Math.max(...all.map(p=>tm(p.d)));if(t1===t0){t0-=864e5;t1+=864e5}
 const vals=all.map(p=>p.v);bands.forEach(b=>{if(b.lo!=null)vals.push(b.lo);if(b.hi!=null)vals.push(b.hi)});
 let lo=Math.min(...vals),hi=Math.max(...vals);const pd=(hi-lo)*.12||1;lo-=pd;hi+=pd;
 const x=d=>L+(tm(d)-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 const dec=hi-lo<8?1:0,ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" direction="ltr" role="img" aria-label="رسم بياني">`;
 bands.forEach(b=>{const y1=y(b.hi??hi),y2=y(b.lo??lo);s+=`<rect x="${L}" y="${y1}" width="${W-L-R}" height="${Math.max(0,y2-y1)}" fill="${b.c}" fill-opacity=".09"/>`;
  [b.lo,b.hi].forEach(v=>{if(v!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${b.c}" stroke-opacity=".5" stroke-dasharray="4 4"/>`})});
 ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${v.toFixed(dec)}</text>`});
 const d0=iso(new Date(t0)),d1=iso(new Date(t1)),dm=iso(new Date((t0+t1)/2));
 [[d0,'start'],[dm,'middle'],[d1,'end']].forEach(([d,a])=>s+=`<text x="${x(d)}" y="${H-8}" text-anchor="${a}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${fmtShort(d)}</text>`);
 series.forEach((se,i)=>{if(!se.pts.length)return;const P=se.pts.map(p=>`${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`);
  if(series.length===1&&se.pts.length>1)s+=`<polygon points="${x(se.pts[0].d)},${H-B} ${P.join(' ')} ${x(se.pts.at(-1).d)},${H-B}" fill="${se.c}" fill-opacity=".08"/>`;
  s+=`<polyline points="${P.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  se.pts.forEach((p,j)=>{const last=j===se.pts.length-1;s+=`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="${last?4.5:2.2}" fill="${last?se.c:'var(--card)'}" stroke="${se.c}" stroke-width="1.5"><title>${fmt(p.d)}: ${p.v} ${unit}</title></circle>`});
  const lp=se.pts.at(-1);s+=`<text x="${Math.min(x(lp.d),W-R)-8}" y="${y(lp.v)-9}" text-anchor="end" font-size="12" font-weight="600" fill="${se.c}" font-family="Readex Pro,sans-serif">${lp.v}</text>`});
 return s+'</svg>';
}

function fieldHTML(f,v){const id='f_'+f.id;v=v??f.def??'';
 if(f.type==='checkbox')return `<label class="chk"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.label)}</label>`;

 sheetSave=async()=>{const out={};for(const f of fields){const el=$('#f_'+f.id);
   if(f.type==='checkbox')out[f.id]=el.checked;
   else if(f.type==='file'){const file=el.files[0];if(file){if(file.size>2.5e6&&!file.type.startsWith('image/')){return err('الملف كبير بزاف (أكثر من 2.5 ميغا). جرب صورة ولا PDF أصغر.')}out[f.id]=await readFile(file,f.maxW||1400);out[f.id+'Name']=file.name}}
   else{let v=el.value.trim();if(f.req&&!v)return err(`عمّر الخانة: ${f.label}`);if(f.type==='number'&&v!==''){v=+v;if(isNaN(v))return err(`${f.label}: خاص رقم`)}out[f.id]=v===''?(f.type==='number'?null:''):v}}
  const r=onSave(out);if(r===false)return;save();closeSheet();render()};
 function err(m){const e=$('#ferr');e.textContent=m;e.hidden=false;return false}
}
function readFile(file,maxW){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{if(!file.type.startsWith('image/'))return res(r.result);const img=new Image();img.onload=()=>{const sc=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=()=>res(r.result);img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- reports ---------- */
function buildReport(from,to,shares){
 const p=S.profile,sec=[],want=k=>!shares||shares[k];
 if(want('profile')){sec.push(['المريض',[`${p.name||'—'}${p.age?'، '+p.age+' عام':''}${p.blood?'، فصيلة الدم '+p.blood:''}`,
  'الأمراض المزمنة: '+(p.chronic.map(c=>c.name).join('، ')||'لا شيء مسجل'),'الحساسية: '+(p.allergies.map(a=>a.name).join('، ')||'لا شيء مسجل')]])}
 if(want('meds')){const act=S.meds.filter(m=>active(m,to));
  sec.push(['الأدوية الحالية',act.length?act.map(m=>{const a=adherence(m,from,to);return `${m.name} — ${m.dose} — ${m.times.join(' و ')}${a.pct!=null?` (الالتزام: ${a.pct}%، ${a.tk} من ${a.exp})`:''}${daysLeft(m)!=null&&daysLeft(m)<=m.lowDays?` — المخزون كيكفي ${daysTxt(daysLeft(m))}`:''}`}):['لا شيء']]);
  const ch=S.meds.filter(m=>(m.start>from&&m.start<=to)||(m.end&&m.end>=from&&m.end<=to));
  if(ch.length)sec.push(['تغييرات فالأدوية',ch.map(m=>m.start>from&&m.start<=to?`بداية ${m.name} فـ${fmt(m.start)}`:`نهاية ${m.name} فـ${fmt(m.end)}`)]);
  const se=S.meds.flatMap(m=>(m.side||[]).filter(s=>s.date>=from&&s.date<=to).map(s=>`${fmt(s.date)} — ${m.name}: ${s.text}`));
  if(se.length)sec.push(['أعراض جانبية ملاحظة',se]);}
 if(want('measures')){const out=[];
  ['bp','sugar','temp','weight','pain'].forEach(t=>{const L=S.measures.filter(m=>m.type===t&&m.date>=from&&m.date<=to);if(!L.length)return;
   if(t==='bp'){const s=L.map(m=>m.v.sys),d=L.map(m=>m.v.dia);out.push(`الضغط (${L.length} قياس): المتوسط ${avg(s)}/${avg(d)}، الأدنى ${Math.min(...s)}/${Math.min(...d)}، الأقصى ${Math.max(...s)}/${Math.max(...d)} ${MT.bp.unit}`)}
   else{const v=L.map(m=>+m.v);out.push(`${MT[t].label} (${L.length} قياس): المتوسط ${avg(v,t==='temp'||t==='weight'?1:0)}، الأدنى ${Math.min(...v)}، الأقصى ${Math.max(...v)} ${MT[t].unit}`)}
   const r=S.ranges[t];if(r){const off=L.filter(m=>inRange(t,m)===false).length;out.push(`   ↳ خارج الحدود اللي حددها الطبيب: ${off} من ${L.length}`)}});
  sec.push(['القياسات',out.length?out:['ما كاين حتى قياس فهاد الفترة']]);
  const dl=S.measures.filter(m=>m.type==='daily'&&m.date>=from&&m.date<=to&&m.symptoms);
  if(dl.length)sec.push(['الأعراض والملاحظات اليومية',dl.map(m=>`${fmt(m.date)}: ${m.symptoms}`)]);}
 if(want('docs')){const dd=S.docs.filter(d=>d.date>=from&&d.date<=to).sort((a,b)=>a.date.localeCompare(b.date));if(dd.length)sec.push(['الوثائق والزيارات',dd.map(d=>`${fmt(d.date)} — ${DT[d.type]}: ${d.title}`)]);
  const nx=S.docs.filter(d=>d.type==='appointment'&&d.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];if(nx)sec.push(['الموعد الجاي',[`${fmt(nx.date)} — ${nx.title}`]])}
 if(!shares){const oq=S.questions.filter(q=>!q.done);if(oq.length)sec.push(['أسئلة للطبيب',oq.map(q=>q.text)])}
 return sec;
}
const avg=(a,dec=0)=>(a.reduce((x,y)=>x+y,0)/a.length).toFixed(dec);

/* ---------- confirm-in-place ---------- */
const armed=new Set();
function confirmBtn(btn,key,fn){if(armed.has(key)){armed.delete(key);fn();return}armed.add(key);const o=btn.textContent;btn.textContent='تأكيد؟';setTimeout(()=>{armed.delete(key);if(btn.isConnected)btn.textContent=o},3000)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(b.tagName==='INPUT')return;
 const med=()=>S.meds.find(m=>m.id===id);
 switch(a){
  case 'go':ui.view=b.dataset.v;render();window.scrollTo(0,0);break;
  case 'close':closeSheet();break;
  case 'fsave':sheetSave&&sheetSave();break;
  case 'g':ui.g=b.dataset.g;render();break;
  case 'order':ui.order=ui.order==='asc'?'desc':'asc';render();break;
  case 'add-note':openForm('حدث أو ملاحظة',[{id:'date',label:'التاريخ',type:'date',req:1,def:today()},{id:'text',label:'شنو وقع',type:'textarea',req:1,ph:'مثلا: دوخة خفيفة فالصباح'}],null,o=>{S.notes.push({id:uid(),...o})});break;
  case 'note-del':confirmBtn(b,a+id,()=>{S.notes=S.notes.filter(n=>n.id!==id);save();render()});break;
  case 'report':{const to=b.dataset.to||today(),from=b.dataset.from||lastVisitBefore(today());openReport(from,to);break}
  case 'report-refresh':{const f=$('#rf').value,t=$('#rt').value;if(f&&t&&f<=t)openReport(f,t);else toast('اختار فترة صحيحة');break}
  case 'copy-report':copy($('#copyArea').value);break;
  case 'dose':{const m=med();setDose(m,b.dataset.t,b.dataset.st);save();render();if(b.dataset.st==='taken'&&m.stock!=null&&daysLeft(m)<=m.lowDays)toast(`${m.name}: المخزون كيكفي ${daysTxt(daysLeft(m))}`);break}
  case 'refill':{const m=med(),first=m.stock==null;openForm((first?'المخزون: ':'علبة جديدة: ')+m.name,[{id:'n',label:first?'شحال باقي عندك دابا':'شحال من وحدة فالعلبة الجديدة',type:'number',req:1,ph:'مثلا 30'}],null,o=>{if(!(o.n>=0)){const e=$('#ferr');e.textContent='دخّل رقم صحيح.';e.hidden=false;return false}m.stock=first?o.n:m.stock+o.n;toast('تحدّث المخزون')});break}
  case 'sos':openSOS();break;
  case 'people':openPeople();break;
  case 'switch':closeSheet();switchTo(id);toast('تفتح ملف '+(S.profile.name||'جديد'));break;
  case 'person-add':openForm('فرد جديد',[{id:'name',label:'الاسم',req:1},{id:'rel',label:'القرابة',half:1,ph:'أنا، الأب، الأم، الولد…'},{id:'age',label:'العمر',type:'number',half:1}],null,o=>{const P=blank(),nid=uid();P.rel=o.rel;P.profile.name=o.name;P.profile.age=o.age??'';DB.persons[nid]=P;DB.activeId=nid;S=P;ui.view='profile';toast('تزاد '+o.name+'. كمّل الملف ديالو.')});break;
  case 'person-del':confirmBtn(b,a+id,()=>{delete DB.persons[id];save();openPeople()});break;
  case 'q-add':openForm('سؤال للطبيب',[{id:'text',label:'السؤال',type:'textarea',req:1,ph:'مثلا: واش نقدر ناخد الدوا قبل النعاس؟'}],null,o=>{S.questions.push({id:uid(),text:o.text,date:today(),done:false,answer:''});toast('تزاد السؤال')});break;
  case 'q-answer':{const q=S.questions.find(x=>x.id===id);openForm('جواب الطبيب',[{id:'answer',label:'شنو قال الطبيب',type:'textarea',req:1},{id:'answeredOn',label:'التاريخ',type:'date',req:1,def:today()}],null,o=>{Object.assign(q,o,{done:true});toast('تسجل الجواب فالقصة الصحية')},`<small class="muted" style="flex:1 1 100%">السؤال: ${esc(q.text)}</small>`);break}
  case 'q-del':confirmBtn(b,a+id,()=>{S.questions=S.questions.filter(q=>q.id!==id);save();render()});break;
  case 'med-add':medForm();break;
  case 'med-edit':medForm(med());break;
  case 'med-del':confirmBtn(b,a+id,()=>{S.meds=S.meds.filter(m=>m.id!==id);save();render()});break;
  case 'side-add':{const m=med();openForm('عرض جانبي: '+m.name,[{id:'date',label:'التاريخ',type:'date',req:1,def:today()},{id:'text',label:'شنو لاحظتي',type:'textarea',req:1}],null,o=>{(m.side=m.side||[]).push(o)},`<small class="muted" style="flex:1 1 100%">التسجيل للمتابعة مع الطبيب. ما توقفش الدواء بلا ما تشاور معاه.</small>`);break}
  case 'family-msg':{const late=todaySlots().filter(s=>s.late),f=S.family;
   const txt=late.length?`السلام ${f.name||''}، ${S.profile.name||'المريض'} ما سجلش ${late.length>1?'هاد الجرعات':'هاد الجرعة'} اليوم:\n`+late.map(s=>`• ${s.m.name} ديال ${s.t}`).join('\n')+'\nعافاك تأكد معاه.':'';
   openSheet('رسالة للعائلة',late.length?`<textarea id="copyArea" rows="6" style="flex:1 1 100%" readonly>${esc(txt)}</textarea>${f.phone?`<small class="muted">الرقم: <span class="num">${esc(f.phone)}</span></small>`:''}`:'<p class="muted">ما كاينة حتى جرعة فاتت اليوم.</p>',late.length?'<button class="btn pri" data-act="copy-area">نسخ الرسالة</button>':'');break}
  case 'copy-area':copy($('#copyArea').value);break;
  case 'mt':ui.mt=b.dataset.t;render();break;
  case 'days':ui.days=+b.dataset.d;render();break;
  case 'm-add':measureForm(ui.mt);break;
  case 'm-del':confirmBtn(b,a+id,()=>{S.measures=S.measures.filter(m=>m.id!==id);save();render()});break;
  case 'range':rangeForm(b.dataset.t);break;
  case 'dt':ui.dt=b.dataset.t;render();break;
  case 'doc-add':docForm();break;
  case 'doc-open':openDoc(id);break;
  case 'doc-edit':docForm(S.docs.find(d=>d.id===id));break;
  case 'doc-del':confirmBtn(b,a+id,()=>{S.docs=S.docs.filter(d=>d.id!==id);save();closeSheet();render()});break;
  case 'p-edit':profileForm();break;
  case 'pl-add':plForm(b.dataset.k);break;
  case 'pl-del':confirmBtn(b,a+id,()=>{S.profile[b.dataset.k]=S.profile[b.dataset.k].filter(x=>x.id!==id);save();render()});break;
  case 'copy-phone':copy(S.profile.doctor.phone);break;
  case 'fam-edit':familyForm();break;
  case 'share-preview':{const f=S.family,from=addDays(today(),-30),sec=buildReport(from,today(),f.shares),title=`ملخص للعائلة (آخر 30 يوم)`;
   openSheet('اللي غادي يشوف '+(f.name||'الشخص الموثوق'),`<div class="report">${sec.length?sec.map(([h,it])=>`<div><h4>${esc(h)}</h4><ul>${it.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join(''):'<p class="muted">ما اخترتي حتى معلومة للمشاركة.</p>'}</div><textarea id="copyArea" rows="5" hidden readonly>${esc(repText(title,sec))}</textarea>`,sec.length?'<button class="btn pri" data-act="copy-area">نسخ الملخص</button>':'');break}
  case 'reset':confirmBtn(b,'reset',()=>{loadDB(freshDB());save();ui.view='profile';render();toast('بدا ملف جديد. عمّر المعلومات الأساسية.')});break;
  case 'wipe':confirmBtn(b,'wipe',()=>{loadDB(freshDB());save();render();toast('تمسحات جميع البيانات ديال جميع الأفراد')});break;
  case 'export':openSheet('نسخة احتياطية',`<p style="margin:0;flex:1 1 100%">حمّل الملف وصيفطو لخوتك (واتساب، إيميل…). هوما كيحلوه من «استرجاع نسخة» فالتطبيق ديالهم. إلا ما تحملش الملف، نسخ النص وحفظو فملف سميتو qissati.json.</p><textarea id="copyArea" rows="6" style="flex:1 1 100%;font-family:monospace;font-size:12px;direction:ltr" readonly>${esc(backupJSON())}</textarea>`,'<button class="btn pri" data-act="export-dl">تحميل الملف</button><button class="btn" data-act="copy-area">نسخ النص</button>');break;
  case 'export-dl':{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));a.download=`qissati-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast('تحمّل الملف')}catch(x){toast('التحميل ما خدمش هنا. استعمل «نسخ النص».')}break}
  case 'import-ok':if(pendingImport){loadDB(pendingImport);pendingImport=null;save();closeSheet();ui.view='story';render();toast('ترجعات النسخة')}break;
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.act==='share'){S.family.shares[t.dataset.k]=t.checked;save()}
 if(t.dataset.act==='notify'){S.family.notifyMissed=t.checked;save()}
 if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.persons&&Object.keys(d.persons).length){}else if(d.profile&&Array.isArray(d.meds))d=wrapOld(d);else throw 0;
   pendingImport=d;const names=Object.values(d.persons).map(P=>P.profile?.name||'بلا اسم');
   openSheet('استرجاع نسخة',`<p style="margin:0;flex:1 1 100%">هاد النسخة ${d.exportedAt?`تحملات نهار <b>${fmt(iso(new Date(d.exportedAt)))}</b>`:'ما فيهاش تاريخ'} وفيها: <b>${names.map(esc).join('، ')}</b>.</p>
    <div class="note alert" style="flex:1 1 100%">${ic('alert')}<div>البيانات اللي فهاد الجهاز دابا غادي تتبدل بهاد النسخة. إلا عندك تسجيلات جداد ما كايناش فيها، صيفط النسخة ديالك قبل.</div></div>`,
    '<button class="btn pri" data-act="import-ok">بدّل البيانات</button><button class="btn" data-act="close">إلغاء</button>')}catch(x){toast('الملف ماشي نسخة احتياطية ديال هاد التطبيق')}t.value=''};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{
 if(e.target.id==='tlq'){ui.q=e.target.value;renderTL()}
 if(e.target.id==='dq'){ui.dq=e.target.value;renderDocs()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ---------- in-page dose reminders ---------- */
const reminded=new Set();
setInterval(()=>{const n=nowHM();Object.entries(DB.persons).forEach(([pid,P])=>todaySlots(P).forEach(s=>{const k=today()+pid+s.m.id+s.t;if(!s.st&&s.t===n&&!reminded.has(k)){reminded.add(k);toast(`وقت الدواء${pid!==DB.activeId?' ديال '+(P.profile.name||''):''}: ${s.m.name} — ${s.m.dose}`,'خذيتها',()=>{setDose(s.m,s.t,'taken');save();render()})}}))},20000);

render();
</script>

</body>
</html>
